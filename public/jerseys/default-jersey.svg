<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#f3f4f6"/>
  <rect x="100" y="80" width="200" height="240" rx="20" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Col du maillot -->
  <rect x="150" y="80" width="100" height="20" rx="10" fill="#1e40af"/>
  
  <!-- Numéro -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">10</text>
  
  <!-- Logo/Sponsor -->
  <rect x="160" y="280" width="80" height="20" rx="5" fill="white" opacity="0.8"/>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e40af">PSG</text>
  
  <!-- Icône de maillot -->
  <g transform="translate(320, 320)">
    <circle cx="0" cy="0" r="30" fill="#3b82f6" opacity="0.1"/>
    <path d="M-15,-10 L15,-10 L15,10 L-15,10 Z" fill="#3b82f6" opacity="0.3"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#3b82f6">👕</text>
  </g>
</svg> 